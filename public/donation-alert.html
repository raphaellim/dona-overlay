<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후원 알림</title><style>
body{margin:0;background:transparent;color:white;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}#alert{width:min(96vw,1000px);margin:20px auto;text-align:center;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;font-weight:900;font-size:clamp(24px,4.8vw,58px);line-height:1.35;text-shadow:3px 3px 0 #111,-3px -3px 0 #111,3px -3px 0 #111,-3px 3px 0 #111,0 5px 6px #111}#alert.show{opacity:1;transform:none}#art{display:none;max-width:72%;max-height:280px;margin:auto auto 14px;border:3px solid #efcee8;border-radius:10px}#source{color:#44ef81}#title{color:#edb94a}#donor,#amount{color:#ffad33}#message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85em;margin-top:8px}#targets{font-size:.63em;margin-top:10px}#time{font-size:.65em}#badge{font-size:.5em;background:#c4ffff;color:#087c82;text-shadow:none;padding:5px 14px;border-radius:30px;vertical-align:middle}#connection{position:fixed;bottom:4px;left:6px;font:12px sans-serif;text-shadow:none;color:#ddd}
</style><div id="alert"><img id="art" alt="시그 이미지"><div><span id="source"></span> <span id="time"></span> <span id="badge" hidden></span> <span id="title"></span></div><div><span id="donor"></span>님 <span id="amount"></span>원 후원!</div><div>후원 감사합니다!</div><div id="message"></div><div id="targets"></div></div><div id="connection" hidden></div><script src="/collection-socket.js"></script><script>
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id),queue=[],seen=new Set(),seenDonations=new Set();let initialized=false;let current=null,timer;
const duration=Math.max(3,Math.min(60,Number(q.get('duration'))||10))*1000;
function updateAge(){if(!current)return;const s=Math.max(0,Math.floor((Date.now()-Date.parse(current.receivedAt))/1000));$('time').textContent='['+(s<1?'방금 전':s<60?s+'초 전':Math.floor(s/60)+'분 전')+']';}
function next(){if(current||!queue.length)return;current=queue.shift();$('source').textContent=current.source==='account'?'[계좌]':'[투네]';$('title').textContent=current.title||'';$('badge').hidden=!current.vip;$('badge').textContent=current.vip||'';$('donor').textContent=current.donor;$('amount').textContent=Number(current.amount).toLocaleString();$('message').textContent=current.message||'';$('targets').textContent=(current.rows||[]).map(r=>r.creator+' '+Number(r.amount).toLocaleString()+'원').join(' · ');$('art').style.display='none';if(current.image){try{const u=new URL(current.image,location.origin);if(u.origin===location.origin&&u.pathname.startsWith('/uploads/')){$('art').src=u.href;$('art').style.display='block';}}catch{}}updateAge();$('alert').classList.add('show');timer=setTimeout(()=>{$('alert').classList.remove('show');setTimeout(()=>{current=null;next();},350);},duration);}
window.addEventListener('collection:changed',e=>{if(e.detail.topic!=='alert')return;const r=e.detail.payload;if(!r||seen.has(r.id))return;seen.add(r.id);for(const id of r.donationIds||[])seenDonations.add(id);if(seen.size>1000)seen.delete(seen.values().next().value);queue.push(r);next();});
async function recover(){try{const r=await fetch('/api/overlay-state?'+q.toString());if(!r.ok)return;const data=await r.json(),groups=new Map();for(const row of data.donations||[]){if(initialized&&!seenDonations.has(row.id)&&!row.silentAlert){const key=row.captureId||row.createdAt+'|'+row.donor;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);}seenDonations.add(row.id);}if(initialized)for(const [key,rows]of groups){if(seen.has(key))continue;seen.add(key);const first=rows[0];queue.push({id:key,source:rows.some(r=>r.accountAmount>0)?'account':'toonie',donor:first.donor,title:first.title,vip:first.vip,amount:rows.reduce((n,r)=>n+r.totalAmount,0),message:first.message,receivedAt:first.receivedAt||first.createdAt,rows:rows.map(r=>({creator:r.creator,amount:r.totalAmount}))});}initialized=true;next();}catch{}}
window.addEventListener('collection:connected',recover);
setInterval(updateAge,1000);if(q.get('status')==='1')$('connection').hidden=false;window.addEventListener('collection:connected',()=>$('connection').textContent='연결됨');window.addEventListener('collection:disconnected',()=>$('connection').textContent='재연결 중');
if(q.get('demo')==='1'){queue.push({id:'demo',source:'toonie',title:'노블 공사단',vip:'VIP',donor:'열려',amount:60000,message:'후원 메시지가 여기에 표시됩니다!',receivedAt:new Date(Date.now()-300000).toISOString(),rows:[{creator:'빵떠기',amount:20000},{creator:'또영이',amount:20000},{creator:'A',amount:20000}]});next();}
</script></html>
