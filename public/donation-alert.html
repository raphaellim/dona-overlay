<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후원 알림</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:white;font-family:system-ui,sans-serif}#alert{position:relative;margin:24px auto;padding:22px;width:min(95vw,700px);border:2px solid #e6be5a;border-radius:16px;background:rgba(12,13,24,.91);box-shadow:0 0 12px #e6be5a55;text-align:center;opacity:0;transition:opacity .2s}#alert.show{opacity:1}.label{color:#eed07d;margin-bottom:10px;font-size:20px}.message{font-size:clamp(24px,5vw,38px);font-weight:900}#amount{color:#ffd16a}#split,#comment{margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap}#age{color:#b8bec9;font-size:15px}#title{color:#eed07d}.star{position:absolute;color:#ffe3a1;opacity:0}.star:nth-of-type(1){left:12px;top:12px}.star:nth-of-type(2){right:12px;top:16px}.star:nth-of-type(3){left:20px;bottom:12px}.star:nth-of-type(4){right:20px;bottom:12px}.show .star{animation:twinkle 1.2s 3}.show .star:nth-of-type(2){animation-delay:.2s}.show .star:nth-of-type(3){animation-delay:.4s}.show .star:nth-of-type(4){animation-delay:.6s}@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}#status{font:12px system-ui;color:#b6bdce;background:#151a27;display:none;padding:4px}@media(prefers-reduced-motion:reduce){.show .star{animation:none}}
.message{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;flex-wrap:nowrap;font-size:clamp(18px,4vw,34px)}#donor{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#amount{flex-shrink:0;white-space:nowrap}</style></head><body><div id="alert" role="status"><span class="star">✦</span><span class="star">✦</span><span class="star">✦</span><span class="star">✦</span><div class="label"><span id="source"></span> <span id="age"></span> <span id="title"></span></div><div class="message"><span id="donor"></span>님 <span id="amount"></span> 후원</div><div id="comment"></div><div id="split"></div></div><div id="status"></div><script src="/alert-queue.js"></script><script src="/collection-socket.js"></script><script>
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);let config={mode:'native',accountEnabled:true,duration:8,playback:{known:false,busy:true}},timer,audio,current,boot=true,settings={},recoveryBusy=false;const seenRows=new Set();
const queue=new DonationAlertQueue({show(r){current=r;$('source').textContent=r.source==='account'?'계좌 후원':'투네 후원';$('title').textContent=[r.vip,r.title].filter(Boolean).join(' · ');$('donor').textContent=r.donor;$('amount').textContent=Number(r.amount).toLocaleString('ko-KR');$('comment').textContent=r.message||'';$('split').textContent=(r.rows||[]).filter(x=>x.creator).map(x=>x.creator+' '+Number(x.amount).toLocaleString()+'').join(' · ');$('alert').classList.add('show');updateAge();
 if(q.get('mute')!=='1'){const file=settings.soundRules?.defaultSound||'alert.mp3';if(/^[a-zA-Z0-9_.-]+\.(mp3|wav|ogg)$/.test(file)){audio=new Audio('/sounds/'+file);audio.preload='none';audio.play().catch(()=>{});}}
 timer=setTimeout(()=>queue.end(),config.duration*1000);
},hide(){clearTimeout(timer);$('alert').classList.remove('show');current=null;if(audio){audio.pause();audio.removeAttribute('src');audio.load();audio=null;}}});
function updateAge(){if(!current)return;const time=Date.parse(current.receivedAt),s=Number.isFinite(time)?Math.max(0,Math.floor((Date.now()-time)/1000)):0;$('age').textContent='['+(s<60?s+'초 전':Math.floor(s/60)+'분 전')+']';}
async function load(){try{const response=await fetch('/api/alert-config?'+q);if(!response.ok)throw Error('알림 설정 조회 실패');config=await response.json();queue.configure(config);const r=await fetch('/api/settings?'+q);if(r.ok)settings=await r.json();status();}catch(e){queue.configure({...config,playback:{known:false,busy:true}});$('status').textContent=e.message;}}
function status(){$('status').textContent=queue.blocked()?'투네 재생 상태 미확인/재생 중 · 계좌 대기 '+queue.queue.length+'건':'알림 연결됨 · 대기 '+queue.queue.length+'건';}
window.addEventListener('collection:changed',e=>{const {topic,payload}=e.detail;if(topic==='playback')load();if(topic==='alert'){for(const id of payload?.donationIds||[])seenRows.add(id);queue.push(payload);status();}if(topic==='state')recover();});
window.addEventListener('collection:connected',async()=>{await load();await recover();});window.addEventListener('collection:disconnected',()=>{queue.configure({...config,playback:{known:false,busy:true}});status();});
async function recover(){if(recoveryBusy)return;recoveryBusy=true;try{const response=await fetch('/api/overlay-state?'+q);if(!response.ok)return;const data=await response.json(),groups=new Map();for(const r of data.donations||[]){if(!boot&&!seenRows.has(r.id)&&!r.silentAlert){const key=r.captureId||r.createdAt+'|'+r.donor;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);}seenRows.add(r.id);}boot=false;for(const [key,rows]of groups){const r=rows[0];queue.push({id:key,receiptOnly:rows.every(x=>x.receiptOnly===true),donationIds:rows.map(x=>x.id),source:rows.some(x=>x.accountAmount>0)?'account':'toonie',donor:r.donor,title:r.title,vip:r.vip,amount:rows.reduce((n,x)=>n+x.totalAmount,0),message:r.message,receivedAt:r.receivedAt||r.createdAt,rows:rows.map(x=>({creator:x.creator,amount:x.totalAmount}))});}while(seenRows.size>3000)seenRows.delete(seenRows.values().next().value);}finally{recoveryBusy=false;status();}}
setInterval(()=>{updateAge();queue.tick();status();},1000);if(q.get('status')==='1')$('status').style.display='block';
if(q.get('demo')==='1'){config={mode:'internal',accountEnabled:true,duration:5};queue.configure(config);queue.push({id:'demo',source:'account',donor:'열려',title:'',amount:60000,receivedAt:new Date().toISOString(),rows:[{creator:'빵떠기',amount:30000},{creator:'또영이',amount:30000}]});}
</script></body></html>
