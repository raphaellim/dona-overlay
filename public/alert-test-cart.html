<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>테스트 알람 담기</title><style>@font-face{font-family:ControlUI;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:16px;background:#141c29;color:#edf3fc;font:15px ControlUI,system-ui}main{max-width:1000px;margin:auto}section{padding:14px;background:#202c3c;border:1px solid #40516b;border-radius:10px;margin:12px 0}fieldset{border:0;padding:0;margin:0;min-width:0}input,select,button{font:inherit;color:inherit;background:#102033;border:1px solid #596d88;border-radius:6px;padding:8px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}label{display:inline-flex;align-items:center;gap:8px;margin:4px}select{max-width:320px}input[type=number]{width:105px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #40516b;padding:8px}td button{padding:5px 8px;margin:2px}.list{max-height:45vh;overflow:auto}#status{color:#96efcc;white-space:pre-wrap}small{color:#bdc8d8}a{color:#8be9cc}@media(max-width:500px){th,td{padding:6px 3px}td input[type=number]{width:65px}.row-name{max-width:145px;overflow-wrap:anywhere}}</style></head><body><main><h1>테스트 알람 장바구니</h1><p>금액·개별 알람·그룹 랜덤을 담아 순서대로 전송합니다. <strong>실제 후원과 정산에는 반영되지 않습니다.</strong></p><fieldset id="editor"><section><div class="controls"><label>종류 <select id="type"><option value="amount">금액으로 담기</option><option value="rule">개별 알람</option><option value="group">그룹 랜덤</option></select></label><label id="amountField">금액(천원) <input id="amount" type="number" min="1" step="0.001" value="10"></label><label id="selectionField" hidden>선택 <select id="selection"></select></label><label>횟수 <input id="count" type="number" min="1" max="100" value="1"></label><button id="add" disabled>＋ 담기</button></div><p><small>1 = 1,000원 / 12.5 = 12,500원 · 최대 30항목, 랜덤 반복 포함 총 100회<br>이미지와 GIF는 이 목록에서 불러오지 않습니다.</small></p></section><section class="list"><table><thead><tr><th>순서</th><th>테스트 알람</th><th>횟수</th><th>관리</th></tr></thead><tbody id="items"></tbody></table></section></fieldset><section><div class="controls"><button id="send" disabled>담은 알람 큐로 전송</button><button id="clear">전체 비우기</button><a id="queue" target="_blank" rel="noopener">재생목록 열기 ↗</a></div><p id="status" role="status">설정 불러오는 중</p><p><small>순서 변경은 장바구니 안에서 적용됩니다. 기존 대기열 뒤에 추가되며, 실행 중인 알람을 중단하지 않습니다. 전송한 테스트도 실제 송출 소스에 표시됩니다.</small></p></section></main><script src="/console-money.js?v=616842"></script><script src="/alert-test-cart.js?v=616842"></script></body></html>
