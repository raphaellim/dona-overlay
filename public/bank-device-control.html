<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>은행 수집 기기 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#101622;color:#edf2fa;font:16px system-ui}main{max-width:900px;margin:auto;padding:28px 18px}section,.card{background:#192334;border:1px solid #34435c;border-radius:14px;padding:20px;margin:18px 0}p{color:#b8c7db;line-height:1.6}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #4c607c}input{background:#101a29;color:white;width:100%}input[type=checkbox]{width:auto}button{background:#a7e7d1;cursor:pointer;color:#142a24}.danger{background:#f1b2b2}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:block;margin:12px 0 6px}.error{color:#ffc1c1;white-space:pre-wrap}a{color:#a7e7d1}.meta{font-size:14px;white-space:pre-wrap;color:#b8c7db}h1{font-size:26px}</style><main><h1>은행 수집 앱 관리</h1><p>방송국 <b id="station"></b> · 방송국 관리자만 연결·설정을 변경할 수 있습니다.</p><div class="row"><a id="login">관리자 로그인</a><a id="capture">수집 대기 목록</a><button id="refresh">새로고침</button></div><section><h2>휴대폰 연결 승인</h2><p>앱의 ‘웹 관리자에게 기기 연결 요청’을 누른 뒤 표시된 10자리 코드를 입력하세요. 이 방송국에 연결됩니다. 승인 후 수집 스위치를 켜고 저장해야 수집을 시작합니다.</p><label>연결 코드 · 10분 유효</label><input id="code" maxlength="12" autocomplete="off" placeholder="앱에 표시된 코드"><label>기본 크리에이터</label><input id="creator" value="빵떠기"><button id="claim" style="margin-top:14px">이 방송국에 연결 승인</button></section><div id="error" class="error"></div><div id="devices"></div><p>웹 설정은 알림 감지 서비스가 실행 중이면 약 30초마다 반영됩니다. 수집 중지·연결 해제 후 서버는 새 전송을 즉시 차단합니다. 은행 선택과 알림 접근 권한은 휴대폰에서 직접 설정하세요.</p></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),station=params.get('station')||'duugi';$('station').textContent=station;$('code').value=params.get('code')||'';
const next=location.pathname+location.search;const login='/station_login.html?station='+encodeURIComponent(station)+'&next='+encodeURIComponent(next);$('login').href=login;$('capture').href='/collection-test.html?station='+encodeURIComponent(station);
async function api(path,body){const r=await fetch(path+'?station='+encodeURIComponent(station),{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d;try{d=await r.json();}catch{throw Error('서버 기기관리 패치 배포 여부를 확인하세요.');}if(!r.ok){if(r.status===401||r.status===403){$('error').textContent=d.error||'관리자 로그인 필요';if(!body&&/로그인/.test(d.error||''))location.replace(login);}throw Error(d.error||'요청 실패');}return d;}
function field(card,title,value){const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.value=value||'';card.append(label,input);return input;}
let loading=false;async function load(){if(loading)return;loading=true;try{const data=await api('/api/station/bank-devices');$('devices').replaceChildren();$('error').textContent='';if(!data.devices.length){$('devices').textContent='연결된 기기가 없습니다.';return;}for(const d of data.devices){const card=document.createElement('div');card.className='card';const title=document.createElement('h2');title.textContent=d.device_name+(d.state==='revoked'?' · 연결 해제됨':'');card.append(title);const at=d.last_seen_at?Date.parse(d.last_seen_at):0;const online=at&&Date.now()-at<90000;const meta=document.createElement('p');meta.className='meta';meta.textContent='마지막 연결: '+(at?new Date(at).toLocaleString('ko-KR'):'아직 동기화 없음')+' · '+(online?'최근 연결 확인':'연결 상태 확인 필요')+'\n알림 권한: '+(d.listener_status||'미확인')+'\n선택 은행 앱: '+Object.entries(d.banks||{}).filter(x=>x[1]).map(x=>({kbank:'케이뱅크',kakao:'카카오뱅크',woori:'우리은행'}[x[0]]||x[0])+': '+x[1]).join(' / ')+'\n최근 상태: '+(d.last_result||'없음');card.append(meta);
if(d.state==='linked'){const name=field(card,'기기 이름',d.device_name),creator=field(card,'기본 크리에이터',d.creator);const label=document.createElement('label'),toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=d.enabled;label.append(toggle,document.createTextNode(' 은행 알림 수집 사용'));card.append(label);const save=document.createElement('button');save.textContent='설정 저장';save.onclick=async()=>{try{await api('/api/station/bank-devices/'+d.id,{deviceName:name.value,creator:creator.value,enabled:toggle.checked});await load();}catch(e){$('error').textContent=e.message;}};const revoke=document.createElement('button');revoke.textContent='기기 연결 해제';revoke.className='danger';revoke.onclick=async()=>{if(!confirm('이 기기의 서버 전송을 차단하고 연결을 해제할까요?'))return;try{await api('/api/station/bank-devices/'+d.id,{revoke:true});await load();}catch(e){$('error').textContent=e.message;}};const row=document.createElement('div');row.className='row';row.append(save,revoke);card.append(row);} $('devices').append(card);}}catch(e){$('error').textContent=e.message;}finally{loading=false;}}
$('claim').onclick=async()=>{if(!confirm('이 휴대폰을 '+station+' 방송국에 연결할까요?'))return;try{await api('/api/station/bank-devices/claim',{code:$('code').value,creator:$('creator').value});$('code').value='';history.replaceState(null,'',location.pathname+'?station='+encodeURIComponent(station));await load();}catch(e){$('error').textContent=e.message;}};$('refresh').onclick=load;load();setInterval(()=>{if(!$('devices').contains(document.activeElement))load();},10000);
</script></html>
