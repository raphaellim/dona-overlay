<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오버레이 미리보기 설정</title><style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#edf3fa;font:15px system-ui,sans-serif}header{padding:15px 22px;border-bottom:1px solid #304052;display:flex;align-items:center;gap:18px}h1{font-size:20px;margin:0}a{color:#abedda}main{display:grid;grid-template-columns:310px minmax(340px,1fr);height:calc(100dvh - 58px)}aside{padding:20px;overflow:auto;border-right:1px solid #304052}p{color:#bac8d8;line-height:1.6}label{display:block;margin:22px 0}label span{display:flex;justify-content:space-between;margin-bottom:10px}input[type=range]{width:100%;accent-color:#83dfc4}button{padding:10px 15px;border:1px solid #4a6477;border-radius:7px;background:#253a4a;color:white;cursor:pointer}button.primary{background:#367e6c}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}#stage{position:relative;overflow:auto;background:linear-gradient(130deg,#dad6cd,#9da995 50%,#d7dedf);padding:24px;display:flex;justify-content:center;align-items:flex-start}iframe{width:308px;height:820px;border:0;flex:0 0 308px;background:transparent}.caption{font-size:12px;margin:0 0 12px}#status{font-size:13px;white-space:pre-wrap}output{font-variant-numeric:tabular-nums;color:#9be3ca}@media(max-width:720px){main{display:flex;flex-direction:column;height:auto}aside{border-right:0}#stage{min-height:600px}header{flex-wrap:wrap}}
</style></head><body><header><h1>오버레이 미리보기</h1><a id="back">운영 콘솔</a></header><main><aside><p class="caption">샘플 데이터로 확인합니다. 저장하기 전에는 송출 화면이 바뀌지 않습니다.</p><label><input type="checkbox" id="enabled"> 사용자 크기 적용</label><label><span>박스 사이 간격 <output id="gapOut"></output></span><input id="gap" type="range" min="0" max="30"></label><label><span>타이틀 글자 <output id="titleSizeOut"></output></span><input id="titleSize" type="range" min="12" max="32"></label><label><span>본문 글자 <output id="contentSizeOut"></output></span><input id="contentSize" type="range" min="12" max="32"></label><div class="actions"><button id="save" class="primary" disabled>설정 저장</button><button id="reset" disabled>기본 디자인</button></div><p id="status" role="status">설정 불러오는 중…</p><p class="caption">기본 디자인은 그대로 유지됩니다. 숫자는 공간이 부족하면 자동으로 줄어듭니다. 투명도·색상은 기존 설정에서 조절하세요.</p></aside><section id="stage" aria-label="오버레이 미리보기"><iframe id="preview" title="실제 오버레이 샘플 미리보기"></iframe></section></main><script src="/overlay3-appearance.js?v=616856"></script><script src="/overlay-appearance-editor.js?v=616859"></script></body></html>
