<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>후원채팅 리모컨</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:auto;padding:14px}.card{background:#171a21;border:1px solid #2a303b;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px #0005}h1{font-size:21px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 12px;color:#ffcf45}.row{display:flex;gap:8px;align-items:center;margin:9px 0}.row>*{min-width:0}input,select,button{font:inherit;border-radius:10px;border:1px solid #343b49;background:#10131a;color:#fff;padding:11px 12px}input,select{width:100%}button{cursor:pointer;font-weight:800}.primary{background:#f2b91f;color:#111;border-color:#f2b91f}.send{width:100%;font-size:17px;padding:15px;background:#18c58f;border-color:#18c58f;color:#07120e}.danger{background:#2a2022}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center}.switch input{width:22px;height:22px}.muted{font-size:12px;color:#9ca6b8;line-height:1.5}.status{font-size:13px;margin-top:9px;color:#7ee8c4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hide{display:none}</style></head><body><div class="wrap">
<h1>💬 후원채팅 리모컨</h1>
<div class="card"><h2>현재 누적후원현황</h2><button class="send" id="sendNow">현재 현황 채팅으로 전송</button><div id="sendStatus" class="status">후원이 없어도 현재 크리에이터 현황을 전송합니다.</div></div>
<div class="card"><h2>후원 등록 자동채팅</h2><div class="switch"><b>후원 저장 시 자동전송</b><input type="checkbox" id="enabled"></div><div class="row"><input id="liveUrl" placeholder="YouTube 라이브 주소"></div><div class="row"><select id="account"><option value="">전송 계정 선택</option></select></div><div class="grid"><label class="switch">1차 후원내역 <input type="checkbox" id="firstEnabled"></label><label class="switch">2차 누적현황 <input type="checkbox" id="secondEnabled"></label></div><div class="row"><input id="firstTemplate" placeholder="{후원자} {금액} {방식} → {분배} {프리셋}"></div><div class="row"><input id="secondTemplate" placeholder="현재 누적후원현황 {누적}"></div><div class="muted">치환값: {후원자} {금액} {방식} {분배} {프리셋} {누적}</div><div class="row"><button class="primary" id="save" style="width:100%">자동채팅 설정 저장</button></div><div id="saveStatus" class="status"></div></div>
<div class="card"><h2>누적현황 주기 자동전송</h2><div class="switch"><b>주기 자동전송</b><input type="checkbox" id="repeatEnabled"></div><div class="row"><select id="minutes"><option value="5">5분마다</option><option value="10" selected>10분마다</option><option value="20">20분마다</option><option value="30">30분마다</option><option value="60">60분마다</option></select></div><div class="muted">이 리모컨 페이지가 열려 있는 동안 설정 간격마다 최신 누적현황을 조회해 전송합니다. 모바일 절전/브라우저 종료 시에는 중단됩니다.</div><div id="repeatStatus" class="status">자동전송 OFF</div></div>
</div><script>
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const station=qs.get('station')||localStorage.getItem('station')||'';if(station)localStorage.setItem('station',station);const base='/api/youtube-chat-service';
async function api(path,opt={}){const sep=path.includes('?')?'&':'?';const u=base+path+sep+'station='+encodeURIComponent(station);const r=await fetch(u,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
let timer=null;function setRepeat(){clearInterval(timer);timer=null;if(!$('repeatEnabled').checked){$('repeatStatus').textContent='자동전송 OFF';return}const m=Number($('minutes').value)||10;localStorage.setItem('donationRepeatEnabled','1');localStorage.setItem('donationRepeatMinutes',String(m));$('repeatStatus').textContent=`${m}분마다 자동전송 ON`;timer=setInterval(()=>sendNow(true),m*60000)}
async function load(){try{const [a,c]=await Promise.all([api('/accounts'),api('/donation-auto')]);$('account').innerHTML='<option value="">전송 계정 선택</option>'+((a.accounts||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join(''));const v=c.auto||{};$('enabled').checked=!!v.enabled;$('liveUrl').value=v.liveUrl||'';$('account').value=v.accountId||'';$('firstEnabled').checked=v.firstEnabled!==false;$('secondEnabled').checked=v.secondEnabled!==false;$('firstTemplate').value=v.firstTemplate||'{후원자} {금액} {방식} → {분배} {프리셋}';$('secondTemplate').value=v.secondTemplate||'현재 누적후원현황 {누적}';$('repeatEnabled').checked=localStorage.getItem('donationRepeatEnabled')==='1';$('minutes').value=localStorage.getItem('donationRepeatMinutes')||'10';setRepeat()}catch(e){$('saveStatus').textContent=e.message}}
async function save(){try{$('save').disabled=true;const body={enabled:$('enabled').checked,liveUrl:$('liveUrl').value.trim(),accountId:$('account').value,firstEnabled:$('firstEnabled').checked,secondEnabled:$('secondEnabled').checked,firstTemplate:$('firstTemplate').value.trim(),secondTemplate:$('secondTemplate').value.trim()};await api('/donation-auto',{method:'PATCH',body:JSON.stringify(body)});$('saveStatus').textContent='저장 완료'}catch(e){$('saveStatus').textContent=e.message}finally{$('save').disabled=false}}
async function sendNow(auto=false){try{if(!auto){$('sendNow').disabled=true;$('sendStatus').textContent='전송 중...'}const r=await api('/donation-cumulative/send',{method:'POST',body:'{}'});$('sendStatus').textContent=(auto?'자동전송 완료 · ':'전송 완료 · ')+(r.message||'')}catch(e){$('sendStatus').textContent=(auto?'자동전송 실패 · ':'전송 실패 · ')+e.message}finally{$('sendNow').disabled=false}}
$('save').onclick=save;$('sendNow').onclick=()=>sendNow(false);$('repeatEnabled').onchange=()=>{localStorage.setItem('donationRepeatEnabled',$('repeatEnabled').checked?'1':'0');setRepeat()};$('minutes').onchange=setRepeat;load();</script></body></html>
