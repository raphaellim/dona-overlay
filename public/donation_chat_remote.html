<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>후원채팅 리모컨</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:540px;margin:auto;padding:14px}.card{background:#171a21;border:1px solid #2a303b;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:21px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 12px;color:#ffcf45}.row{display:flex;gap:8px;align-items:center;margin:9px 0}input,select,button{font:inherit;border-radius:10px;border:1px solid #343b49;background:#10131a;color:#fff;padding:11px 12px}input[type=text],select{width:100%}button{cursor:pointer;font-weight:800}.primary{background:#f2b91f;color:#111;border-color:#f2b91f}.connect{background:#ff315f;border-color:#ff315f;width:100%}.send{width:100%;font-size:17px;padding:15px;background:#18c58f;border-color:#18c58f;color:#07120e}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center}.switch input{width:22px;height:22px}.checks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.check{padding:10px 6px;border:1px solid #343b49;border-radius:10px;text-align:center}.check input{width:18px;height:18px}.muted{font-size:12px;color:#9ca6b8;line-height:1.5}.status{font-size:13px;margin-top:9px;color:#7ee8c4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div class="wrap">
<h1>💬 후원채팅 리모컨</h1>
<div class="card"><h2>YouTube 연결</h2><button class="connect" id="connect">+ YouTube 전송 계정 연결</button><div class="row"><select id="account"><option value="">전송 계정 선택</option></select></div><div class="row"><input type="text" id="liveUrl" placeholder="YouTube 라이브 주소"></div><div class="row"><button class="primary" id="saveConnection" style="width:100%">연결정보 저장</button></div><div id="connStatus" class="status"></div></div>
<div class="card"><h2>전송할 현재 현황</h2><div class="checks"><label class="check"><input type="checkbox" id="selC"> 누적후원</label><label class="check"><input type="checkbox" id="selP"> 프리셋</label><label class="check"><input type="checkbox" id="selA"> 용돈</label></div><div class="muted" style="margin-top:9px">현재 프로그램에 저장된 값을 그대로 읽습니다. 여러 개 선택하면 선택한 항목을 각각 채팅으로 전송합니다.</div><div class="row"><button class="send" id="sendNow">선택 현황 채팅으로 전송</button></div><div id="sendStatus" class="status"></div></div>
<div class="card"><h2>후원 등록 자동채팅</h2><div class="switch"><b>후원 저장 시 자동전송</b><input type="checkbox" id="enabled"></div><div class="grid"><label class="switch">후원내역 <input type="checkbox" id="firstEnabled"></label><label class="switch">누적현황 <input type="checkbox" id="secondEnabled"></label></div><div class="row"><input type="text" id="firstTemplate" placeholder="{후원자} {금액} {방식} → {분배} {프리셋}"></div><div class="row"><input type="text" id="secondTemplate" placeholder="현재 누적후원현황 {누적}"></div><div class="muted">후원등록 자동채팅은 기존 방식 유지 · 프리셋 후원이면 {프리셋}에 자동 표시됩니다.</div></div>
<div class="card"><h2>선택 현황 주기 자동전송</h2><div class="switch"><b>주기 자동전송</b><input type="checkbox" id="repeatEnabled"></div><div class="row"><select id="minutes"><option value="5">5분마다</option><option value="10">10분마다</option><option value="20">20분마다</option><option value="30">30분마다</option><option value="60">60분마다</option></select></div><div class="muted">위에서 체크한 누적후원/프리셋/용돈만 자동 전송합니다. 현재 버전은 이 리모컨 페이지가 열려 있을 때 주기 전송됩니다.</div><div id="repeatStatus" class="status"></div></div>
<div class="card"><button class="primary" id="saveAll" style="width:100%;font-size:16px">후원채팅 전체 설정 저장</button><div id="saveStatus" class="status"></div></div>
</div><script>
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),station=qs.get('station')||localStorage.getItem('station')||'';if(station)localStorage.setItem('station',station);const base='/api/youtube-chat-service';
async function api(path,opt={}){const u=base+path+(path.includes('?')?'&':'?')+'station='+encodeURIComponent(station);const r=await fetch(u,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
function sels(){return [$('selC').checked&&'cumulative',$('selP').checked&&'preset',$('selA').checked&&'allowance'].filter(Boolean)}
function body(){return {enabled:$('enabled').checked,liveUrl:$('liveUrl').value.trim(),accountId:$('account').value,firstEnabled:$('firstEnabled').checked,secondEnabled:$('secondEnabled').checked,firstTemplate:$('firstTemplate').value.trim(),secondTemplate:$('secondTemplate').value.trim(),statusSelections:sels(),repeatEnabled:$('repeatEnabled').checked,repeatMinutes:Number($('minutes').value)||10}}
let timer=null;function setRepeat(){clearInterval(timer);timer=null;if(!$('repeatEnabled').checked){$('repeatStatus').textContent='자동전송 OFF';return}const m=Number($('minutes').value)||10;$('repeatStatus').textContent=`${m}분마다 선택 현황 자동전송 ON`;timer=setInterval(()=>sendNow(true),m*60000)}
async function save(msg=true){const v=body();if(!v.statusSelections.length)throw Error('전송할 현황을 하나 이상 선택하세요.');await api('/donation-auto',{method:'PATCH',body:JSON.stringify(v)});if(msg)$('saveStatus').textContent='저장 완료';setRepeat()}
async function load(){try{const [a,c]=await Promise.all([api('/accounts'),api('/donation-auto')]);$('account').innerHTML='<option value="">전송 계정 선택</option>'+((a.accounts||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join(''));const v=c.auto||{};$('account').value=v.accountId||'';$('liveUrl').value=v.liveUrl||'';$('enabled').checked=!!v.enabled;$('firstEnabled').checked=v.firstEnabled!==false;$('secondEnabled').checked=v.secondEnabled!==false;$('firstTemplate').value=v.firstTemplate||'{후원자} {금액} {방식} → {분배} {프리셋}';$('secondTemplate').value=v.secondTemplate||'현재 누적후원현황 {누적}';const ss=v.statusSelections||['cumulative'];$('selC').checked=ss.includes('cumulative');$('selP').checked=ss.includes('preset');$('selA').checked=ss.includes('allowance');$('repeatEnabled').checked=!!v.repeatEnabled;$('minutes').value=String(v.repeatMinutes||10);$('connStatus').textContent=(a.configured?'YouTube API 설정됨 · ':'YouTube API 환경설정 필요 · ')+(a.accounts||[]).length+'개 계정 연결됨';setRepeat()}catch(e){$('connStatus').textContent=e.message}}
async function sendNow(auto=false){try{if(!sels().length)throw Error('전송할 현황을 하나 이상 선택하세요.');if(!auto){$('sendNow').disabled=true;$('sendStatus').textContent='전송 중...'}await save(false);const r=await api('/donation-status/send',{method:'POST',body:JSON.stringify({selections:sels()})});$('sendStatus').textContent=(auto?'자동전송 완료 · ':'전송 완료 · ')+(r.messages||[]).join(' / ')}catch(e){$('sendStatus').textContent=(auto?'자동전송 실패 · ':'전송 실패 · ')+e.message}finally{$('sendNow').disabled=false}}
$('connect').onclick=()=>{location.href=base+'/auth?station='+encodeURIComponent(station)};$('saveConnection').onclick=async()=>{try{await save(false);$('connStatus').textContent='라이브 주소/전송 계정 저장 완료'}catch(e){$('connStatus').textContent=e.message}};$('saveAll').onclick=async()=>{try{await save(true)}catch(e){$('saveStatus').textContent=e.message}};$('sendNow').onclick=()=>sendNow(false);$('repeatEnabled').onchange=setRepeat;$('minutes').onchange=setRepeat;load();
</script></body></html>
