<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>후원채팅 리모컨</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f5f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:540px;margin:auto;padding:14px}.card{background:#171a21;border:1px solid #2a303b;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:21px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 12px;color:#ffcf45}.row{display:flex;gap:8px;align-items:center;margin:9px 0}input,select,button{font:inherit;border-radius:10px;border:1px solid #343b49;background:#10131a;color:#fff;padding:11px 12px}input[type=text],select{width:100%}button{cursor:pointer;font-weight:800}.primary{background:#f2b91f;color:#111;border-color:#f2b91f}.connect{background:#ff315f;border-color:#ff315f;width:100%}.send{width:100%;font-size:17px;padding:15px;background:#18c58f;border-color:#18c58f;color:#07120e}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center}.switch input{width:22px;height:22px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{padding:10px 6px;border:1px solid #343b49;border-radius:10px;text-align:center}.check input{width:18px;height:18px}.muted{font-size:12px;color:#9ca6b8;line-height:1.5}.status{font-size:13px;margin-top:9px;color:#7ee8c4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div class="wrap">
<h1>💬 후원채팅 리모컨</h1>
<div class="card"><h2>YouTube 연결</h2><button class="connect" id="connect">+ YouTube 전송 계정 연결</button><div class="row"><select id="account"><option value="">전송 계정 선택</option></select></div><div class="row"><input type="text" id="liveUrl" placeholder="YouTube 라이브 주소"></div><div class="grid"><button class="primary" id="checkLive">방송 연결 확인</button><button class="primary" id="saveConnection">연결정보 저장</button></div><div id="connStatus" class="status"></div><div id="accountStatus" class="muted" style="margin-top:8px"></div></div>
<div class="card"><h2>전송할 현재 현황</h2><div class="checks"><label class="check"><input type="checkbox" id="selC"> 누적후원</label><label class="check"><input type="checkbox" id="selD"> 계좌후원자</label><label class="check"><input type="checkbox" id="selP"> 프리셋</label><label class="check"><input type="checkbox" id="selA"> 용돈</label></div><div class="muted" style="margin-top:9px">누적후원과 계좌후원자 명단은 서로 다른 채팅으로 전송됩니다. 같은 계좌 후원자는 이름별로 합산됩니다.</div><div class="row"><button class="send" id="sendNow">선택 현황 채팅으로 전송</button></div><div id="sendStatus" class="status"></div></div>
<div class="card"><h2>후원 등록 자동채팅</h2><div class="switch"><b>후원 저장 시 자동전송</b><input type="checkbox" id="enabled"></div><div class="checks"><label class="check"><input type="checkbox" id="firstEnabled"> 후원내역</label><label class="check"><input type="checkbox" id="secondEnabled"> 누적현황</label><label class="check"><input type="checkbox" id="accountDonorsEnabled"> 계좌후원자</label></div><div class="row"><input type="text" id="firstTemplate" placeholder="💸{후원자}업({금액}) → {분배}"></div><div class="row"><input type="text" id="secondTemplate" placeholder="💰누적 {누적}"></div><div class="muted">각 항목을 독립적으로 선택할 수 있습니다. 계좌후원자 명단은 실제 계좌후원이 들어왔을 때만 자동 갱신됩니다.</div></div>
<div class="card"><h2>선택 현황 주기 자동전송</h2><div class="switch"><b>주기 자동전송</b><input type="checkbox" id="repeatEnabled"></div><div class="row"><select id="minutes"><option value="5">5분마다</option><option value="10">10분마다</option><option value="20">20분마다</option><option value="30">30분마다</option><option value="60">60분마다</option></select></div><div class="muted">위에서 체크한 누적후원/계좌후원자를 서버에서 주기 자동 전송합니다. 리모컨 페이지를 닫아도 계속 동작합니다.</div><div id="repeatStatus" class="status"></div></div>
<div class="card"><button class="primary" id="saveAll" style="width:100%;font-size:16px">후원채팅 전체 설정 저장</button><div id="saveStatus" class="status"></div></div>
</div><script>
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),station=qs.get('station')||localStorage.getItem('station')||'';if(station)localStorage.setItem('station',station);const base='/api/youtube-chat-service';
async function api(path,opt={}){const u=base+path+(path.includes('?')?'&':'?')+'station='+encodeURIComponent(station);const r=await fetch(u,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function rootApi(path,opt={}){const u=path+(path.includes('?')?'&':'?')+'station='+encodeURIComponent(station);const r=await fetch(u,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
function sels(){return [$('selC').checked&&'cumulative',$('selP').checked&&'preset',$('selA').checked&&'allowance'].filter(Boolean)}
function body(){return {enabled:$('enabled').checked,liveUrl:$('liveUrl').value.trim(),accountId:$('account').value,firstEnabled:$('firstEnabled').checked,secondEnabled:$('secondEnabled').checked,accountDonorsEnabled:$('accountDonorsEnabled').checked,firstTemplate:$('firstTemplate').value.trim(),secondTemplate:$('secondTemplate').value.trim(),statusSelections:sels(),statusAccountDonors:$('selD').checked,repeatEnabled:$('repeatEnabled').checked,repeatMinutes:Number($('minutes').value)||10}}
function setRepeat(){if(!$('repeatEnabled').checked){$('repeatStatus').textContent='서버 자동전송 OFF';return}const m=Number($('minutes').value)||10;$('repeatStatus').textContent=`서버에서 ${m}분마다 선택 현황 자동전송 ON`}
function manText(won){const n=Math.trunc(Number(won||0)/1000)/10;return n.toFixed(1).replace(/\.0$/,'')}
function statusMessages(summary,selected){
  const messages=[];
  const creators=Array.isArray(summary?.creators)?summary.creators:[];
  if(selected.includes('cumulative')){
    const hearts=['💗','💙','💛','💜','💚','🧡','🤍','🩵'];
    const parts=creators
      .filter(x=>Number(x.total||0)!==0)
      .map((x,i)=>`${hearts[i%hearts.length]}${x.creator}(${x.totalText||manText(x.total)})`);
    messages.push(parts.length?`💰누적 ${parts.join('·')}`:'💰누적 0');
  }
  if($('selD').checked){
    const donors=Array.isArray(summary?.accountDonors)?summary.accountDonors:[];
    const parts=donors
      .filter(x=>Number(x.amount||0)>0)
      .map(x=>`${x.donor}(${x.amountText||manText(x.amount)})`);
    messages.push(parts.length?`🏦계좌 ${parts.join('·')}`:'🏦계좌 0');
  }
  const side=[];
  if(selected.includes('preset')){
    const p=[];
    for(const c of creators){
      for(const n of (Array.isArray(c.presetNets)?c.presetNets:[])){
        const net=Number(n.net||0);
        if(!net)continue;
        const label=net>0?(n.plusName||n.presetTitle||n.presetId||'프리셋'):(n.minusName||n.presetTitle||n.presetId||'프리셋');
        p.push(`${c.creator} ${label} ${net>0?'+':''}${net}`);
      }
    }
    side.push(p.length?`🎛 ${p.join(' | ')}`:'🎛 프리셋 0');
  }
  if(selected.includes('allowance')){
    const a=summary?.settings?.allowanceData||summary?.allowanceData||{};
    const v=Number(a.balance??a.current??a.amount??0)||0;
    side.push(`💵 용돈 ${v.toLocaleString('ko-KR')}원`);
  }
  if(side.length)messages.push(side.join(' | '));
  return messages.filter(Boolean);
}

async function save(msg=true){const v=body();if(!v.statusSelections.length&&!v.statusAccountDonors)throw Error('전송할 현황을 하나 이상 선택하세요.');await api('/donation-auto',{method:'PATCH',body:JSON.stringify(v)});if(msg)$('saveStatus').textContent='저장 완료';setRepeat()}
async function load(){try{const [a,c]=await Promise.all([api('/accounts'),api('/donation-auto')]);$('account').innerHTML='<option value="">전송 계정 선택</option>'+((a.accounts||[]).map(x=>`<option value="${x.id}" ${x.connected===false?'disabled':''}>${x.name}${x.connected===false?' · 재연결 필요':''}</option>`).join('')); $('accountStatus').textContent=(a.accounts||[]).map(x=>`${x.connected===false?'🔴':'🟢'} ${x.name}${x.authError?' · '+x.authError:''}`).join(' / ');const v=c.auto||{};$('account').value=v.accountId||'';$('liveUrl').value=v.liveUrl||'';$('enabled').checked=!!v.enabled;$('firstEnabled').checked=v.firstEnabled!==false;$('secondEnabled').checked=v.secondEnabled!==false;$('accountDonorsEnabled').checked=!!v.accountDonorsEnabled;const oldDefaults=['💸 {후원자} {금액} {방식} → {분배} {프리셋}','{후원자} {금액} {방식} → {분배}','💸 {후원자} {금액} {방식} → {분배}'];
$('firstTemplate').value=(!v.firstTemplate||oldDefaults.includes(v.firstTemplate))?'💸{후원자}업({금액}) → {분배}':v.firstTemplate;$('secondTemplate').value=(!v.secondTemplate||v.secondTemplate==='{누적}'||v.secondTemplate==='현재 누적후원현황 {누적}')?'💰누적 {누적}':v.secondTemplate;const ss=v.statusSelections||['cumulative'];$('selC').checked=ss.includes('cumulative');$('selD').checked=!!v.statusAccountDonors;$('selP').checked=ss.includes('preset');$('selA').checked=ss.includes('allowance');$('repeatEnabled').checked=!!v.repeatEnabled;$('minutes').value=String(v.repeatMinutes||10);$('connStatus').textContent=(a.configured?'YouTube API 설정됨 · ':'YouTube API 환경설정 필요 · ')+(a.accounts||[]).length+'개 계정 연결됨';setRepeat()}catch(e){$('connStatus').textContent=e.message}}
async function sendNow(auto=false){try{const selected=sels();if(!selected.length&&!$('selD').checked)throw Error('전송할 현황을 하나 이상 선택하세요.');const accountId=$('account').value,liveUrl=$('liveUrl').value.trim();if(!accountId)throw Error('전송 계정을 선택하세요.');if(!liveUrl)throw Error('YouTube 라이브 주소를 입력하세요.');if(!auto){$('sendNow').disabled=true;$('sendStatus').textContent='전송 중...'}await save(false);const summary=await rootApi('/api/summary');const messages=statusMessages(summary,selected);if(!messages.length)throw Error('전송할 현황 메시지를 만들 수 없습니다.');const sent=[];for(const message of messages){await api('/send-exact',{method:'POST',body:JSON.stringify({url:liveUrl,accountId,message})});sent.push(message)}$('sendStatus').textContent=(auto?'자동전송 완료 · ':'전송 완료 · ')+sent.join(' / ')}catch(e){$('sendStatus').textContent=(auto?'자동전송 실패 · ':'전송 실패 · ')+e.message}finally{$('sendNow').disabled=false}}
$('connect').onclick=()=>{location.href=base+'/auth?station='+encodeURIComponent(station)+'&return=donation'};$('checkLive').onclick=async()=>{try{const a=$('account').value,u=$('liveUrl').value.trim();if(!a)throw Error('전송 계정을 선택하세요.');if(!u)throw Error('YouTube 라이브 주소를 입력하세요.');$('connStatus').textContent='방송 연결 확인 중...';const r=await api('/resolve',{method:'POST',body:JSON.stringify({url:u,accountId:a})});$('connStatus').textContent='🟢 채팅 가능 · '+(r.title||'라이브 방송')}catch(e){$('connStatus').textContent='🔴 '+e.message}};$('saveConnection').onclick=async()=>{try{await save(false);$('connStatus').textContent='라이브 주소/전송 계정 저장 완료'}catch(e){$('connStatus').textContent=e.message}};$('saveAll').onclick=async()=>{try{await save(true)}catch(e){$('saveStatus').textContent=e.message}};$('sendNow').onclick=()=>sendNow(false);$('repeatEnabled').onchange=setRepeat;$('minutes').onchange=setRepeat;load();
</script></body></html>
