<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독립 이미지·사운드 알림</title><style>@font-face{font-family:OverlayPretendard;src:url('/fonts/PretendardVariable.woff2');font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:OverlayPretendard,system-ui,sans-serif}#alert[hidden]{display:none}#alert{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;pointer-events:none}#image{width:min(480px,100%);height:min(270px,65%);object-fit:contain}#image[hidden]{display:none}#text{max-width:100%;padding:9px 14px;border-radius:8px;background:#10231fe6;color:#fff;font-size:28px;font-weight:700;text-align:center;overflow-wrap:anywhere}#comment{font-size:18px;margin-top:5px;white-space:pre-wrap}#status{position:fixed;left:4px;bottom:4px;font:12px system-ui;color:#fff;background:#17222de6;display:none}#unlock{position:fixed;left:8px;bottom:8px;z-index:10;padding:12px;font:700 16px system-ui}button[hidden]{display:none}#text{position:relative;width:min(440px,100%);padding:14px 18px;border:2px solid #e6be5a;border-radius:16px;background:rgba(10,22,30,.94);color:#fff;font-weight:700;text-align:center;overflow-wrap:anywhere;box-shadow:0 0 10px #e6be5a33}#label{color:#eed07d;font-size:15px;line-height:1.4;margin-bottom:7px;letter-spacing:1px}#title{display:flex;justify-content:center;align-items:center;gap:14px;font-size:34px;font-weight:850;line-height:1.25;white-space:nowrap}#donor{min-width:0}#amount{color:#ffd16a;font-variant-numeric:tabular-nums;flex-shrink:0}#split{font-size:18px;line-height:1.4;color:#c8e9e1;margin-top:8px}#comment{font-size:18px;line-height:1.4;color:#f1f3f7;margin-top:5px;white-space:pre-wrap}#split:empty,#comment:empty{display:none}.spark{position:absolute;color:#ffe3a1;font-size:15px;pointer-events:none}.s1{left:9px;top:9px}.s2{right:9px;top:9px}#alert:not([hidden]) .spark{animation:twinkle 1.2s 3}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){#alert .spark{animation:none!important}}</style></head><body><div id="alert" hidden><img id="image" hidden alt="후원 알림 이미지"><div id="text"><span class="spark s1">✦</span><span class="spark s2">✦</span><div id="label">계좌후원</div><div id="title"><span id="donor"></span><span id="amount"></span></div><div id="split"></div><div id="comment"></div></div></div><div id="status"></div><button id="unlock" hidden>알림 소리 켜기</button><script>window.soundAlertNativeFetch=window.fetch.bind(window);</script><script src="/collection-socket.js?v=61671"></script><script src="/sound-alert.js?v=61671"></script></body></html>
