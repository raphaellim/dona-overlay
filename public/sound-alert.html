}#alert:not([hidden]) .spark{animation:twinkle 1.2s 3}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){#alert .spark{animation:none!important}}</style><link rel="stylesheet" href="/donation-alert-text.css?v=616814"><style>#alert #title{font-size:var(--alert-line-size,34px)!important;line-height:1.25!important}#alert #donor,#alert #amount{font-size:inherit!important;line-height:1.25!important}#alert #source{font-size:27px!important;font-weight:900!important;line-height:35px!important}#alert #comment{font-size:21px;line-height:28px}#alert #split{font-size:16px;line-height:22px}</style><style>#donatedAgo{font-size:14px;line-height:20px;font-weight:600;color:#d4dce6;margin-top:7px}#donatedAgo:empty{display:none}</style><style>#alert #amount{font-size:42px!important;font-weight:900;line-height:1.15!important;margin-bottom:10px}#alert #title{gap:5px;font-size:var(--alert-line-size,28px)!important}#alert #source{font-size:.72em!important;font-weight:750!important;line-height:1.3!important;margin-left:7px}#honorific{font-size:.58em;font-weight:600}#signature{font-size:23px;font-weight:800;line-height:1.35;margin-top:9px;color:#f3e2a1}#signature:empty{display:none}</style><style>#alert{gap:6px}#alert #image{width:min(400px,100%);height:min(225px,60%)}#alert #text{width:min(365px,100%);padding:11px 14px;border-radius:13px;box-shadow:0 0 7px #e6be5a33}#alert #amount{font-size:36px!important;margin-bottom:7px}#alert #title{font-size:var(--alert-line-size,24px)!important}#alert #signature{font-size:20px;margin-top:6px}#alert #comment{font-size:17px;line-height:23px}#alert #donatedAgo{font-size:12px;line-height:17px;margin-top:5px}.celebrate{position:absolute;inset:0;pointer-events:none}.celebrate i{position:absolute;left:50%;top:25%;font-size:19px;font-style:normal;opacity:0}.celebrate i:nth-child(1){--x:-140px;--y:-65px}.celebrate i:nth-child(2){--x:-95px;--y:-100px}.celebrate i:nth-child(3){--x:-
