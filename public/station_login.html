<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방송국 로그인</title><link rel="stylesheet" href="/console.css"><style>main{max-width:450px;margin:8vh auto}input{width:100%}.roles{display:flex;gap:8px;margin-bottom:20px}label{margin:15px 0}button.primary{width:100%;margin-top:15px}</style></head><body><main><article><h1>방송국 로그인</h1><div class="roles"><button id="admin" class="active">방송국 관리자</button><button id="manager">방송 매니저</button></div><form id="form"><label>방송국 코드<input id="station" required autocapitalize="off" autocomplete="organization" placeholder="예: duugi"></label><label id="userRow" hidden>매니저 아이디<input id="username" autocapitalize="off" autocomplete="username"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="submit">로그인</button></form><p id="error" role="status"></p></article></main><script>
let role=new URLSearchParams(location.search).get('role')==='manager'?'manager':'admin';const $=id=>document.getElementById(id);$('station').value=new URLSearchParams(location.search).get('station')||'';
function select(value){role=value;$('admin').classList.toggle('active',role==='admin');$('manager').classList.toggle('active',role==='manager');$('userRow').hidden=role!=='manager';$('username').required=role==='manager';$('error').textContent='';}$('admin').onclick=()=>select('admin');$('manager').onclick=()=>select('manager');select(role);
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const station=$('station').value.trim().toLowerCase();if(!/^[a-z0-9_-]+$/.test(station))throw Error('방송국 코드를 확인하세요');const r=await fetch(role==='admin'?'/api/station-login':'/api/operator-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({station,username:$('username').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'로그인 실패');localStorage.setItem('STATION_SLUG',station);location.replace('/console.html?station='+encodeURIComponent(station));}catch(e){$('error').textContent=e.message;}finally{$('submit').disabled=false;}};
</script></body></html>
