<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후원 분배 · 승인</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111723;color:#edf5ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}section,article{padding:20px;background:#1b2537;border:1px solid #34465f;border-radius:14px;margin:16px 0}input,select,button,textarea{font:inherit;padding:10px;background:#0e1726;color:white;border:1px solid #526986;border-radius:8px}button{cursor:pointer;background:#b2efda;color:#153c30}label{display:block;margin:12px 0}textarea{width:100%;min-height:170px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.hold{color:#ffbf80}.review{color:#b2efda}.muted{color:#acbdd1}a{color:#b2efda}#error{color:#ffb7b7;white-space:pre-wrap}</style>
<main><p><a id="integratedInput">기존 후원입력에서 처리하기</a> · <a id="integratedControl">컨트롤에서 모드·대상 설정하기</a></p><h1>후원 분배 · 확인 승인</h1><a id="capture">수집 · 기기 연결</a><p id="connection">웹소켓 연결 중</p><section><h2>방송 모드 · 후원 대상</h2><select id="mode"><option value="collab">합방 · 확인 승인</option><option value="solo">단독 · 자동 반영</option></select><p>한 줄에 이름 | 방송인 또는 기타 | 별칭(쉼표 구분) | 참여 여부(켜짐/꺼짐). 기타는 국고·운영비·스탭 등입니다. ‘각2’·‘균등’은 참여 중인 방송인만 분배합니다.</p><textarea id="targets" placeholder="빵떠기 | 방송인 | 떠기 | 켜짐&#10;또영이 | 방송인 | 또영 | 켜짐&#10;국고 | 기타 | 운영비 | 켜짐"></textarea><button id="saveRules">설정 저장</button><p class="muted">숫자는 만 원 단위입니다. 아래 수동 분배 금액은 원 단위입니다. 기존 대기 내역은 설정 변경으로 자동 승인되지 않습니다.</p></section><div id="error"></div><section><h2>승인 대기 · 보류</h2><button id="refresh">새로고침</button><div id="list"></div></section></main>
<script src="/collection-socket.js"></script><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),station=q.get('station')||'duugi';let config={targets:[]},loading=false,first=true;
$('integratedInput').href='/admin.html?station='+encodeURIComponent(station);$('integratedControl').href='/control.html?station='+encodeURIComponent(station);
$('capture').href='/collection-test.html?station='+encodeURIComponent(station);
async function api(path,body){const r=await fetch(path+'?station='+encodeURIComponent(station),{method:body?'POST':'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d;}
function input(parent,value){const e=document.createElement('input');e.value=value||'';parent.append(e);return e;}
function split(parent,creator='',amount=''){const line=document.createElement('div');line.className='row';const s=document.createElement('select');s.append(new Option('대상 선택',''));for(const t of config.targets)s.append(new Option(t.name+' · '+(t.group==='other'?'방송인 외':'방송인'),t.name));s.value=creator;line.append(s);const a=input(line,amount);a.type='number';a.min=1;a.placeholder='원 단위';const remove=document.createElement('button');remove.textContent='삭제';remove.onclick=()=>line.remove();line.append(remove);line.read=()=>({creator:s.value,amount:Number(a.value)});parent.append(line);}
function render(rows){$('list').replaceChildren();for(const r of rows){const card=document.createElement('article');const h=document.createElement('h3');h.textContent=(r.source==='account'?'계좌':'투네')+' · '+[r.title,r.donor].filter(Boolean).join(' · ')+' · '+Number(r.amount).toLocaleString()+'원';const reason=document.createElement('p');reason.className=r.status==='hold'?'hold':'review';reason.textContent=(r.status==='hold'?'보류':'승인 대기')+' · '+(r.routing?.reason||'분류 필요');const original=document.createElement('p');original.textContent='원문: '+r.donor+' / '+(r.message||'');const time=document.createElement('p');time.className='muted';time.dataset.at=r.received_at;card.append(h,reason,original,time);const label=document.createElement('label');label.textContent='후원자';card.append(label);const donor=input(card,r.routing?.donor||r.donor),parts=document.createElement('div');card.append(parts);for(const part of r.routing?.rows||[])split(parts,part.creator,part.amount);if(!parts.children.length)split(parts);const add=document.createElement('button');add.textContent='분배 대상 추가';add.onclick=()=>split(parts);card.append(add);const actions=document.createElement('div');actions.className='row';for(const [action,text] of [['edit','수정 저장'],['approve','확인 · 승인']]){const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{try{b.disabled=true;const adopt=action==='approve'&&!r.broadcast_id;if(adopt&&!confirm('이전 버전 내역에 수집 당시 방송 정보가 없습니다. 현재 방송에 반영할까요?'))return;await api('/api/collection-candidates/'+r.id+'/'+action,{adoptCurrent:adopt,donor:donor.value,rows:[...parts.children].map(x=>x.read())});await load(true);}catch(e){$('error').textContent=e.message;}finally{b.disabled=false;}};actions.append(b);}const dismiss=document.createElement('button');dismiss.textContent='내역 삭제';dismiss.onclick=async()=>{if(confirm('이 내역을 삭제할까요?')){try{await api('/api/'+r.source+'-candidates/'+r.id+'/dismiss',{});await load(true);}catch(e){$('error').textContent=e.message;}}};actions.append(dismiss);card.append(actions);$('list').append(card);if(q.get('candidate')===r.id)card.style.borderColor='#b2efda';}age();}
async function load(force=false){if(loading||(!force&&$('list').contains(document.activeElement)))return;loading=true;try{config=await api('/api/station/collection-rules');if(first){$('mode').value=config.mode;$('targets').value=config.targets.map(t=>[t.name,t.group==='other'?'기타':'방송인',t.aliases.join(','),t.active?'켜짐':'꺼짐'].join(' | ')).join('\n');first=false;}const [a,b]=await Promise.all([api('/api/account-candidates'),api('/api/toonie-candidates')]);render([...a.candidates,...b.candidates].sort((x,y)=>Date.parse(y.received_at)-Date.parse(x.received_at)));$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{loading=false;}}
$('saveRules').onclick=async()=>{try{const targets=$('targets').value.split('\n').filter(x=>x.trim()).map(line=>{const [name,group,aliases='',active='켜짐']=line.split('|').map(x=>x.trim());return {name,group:group==='방송인'?'streamer':'other',aliases:aliases.split(',').map(x=>x.trim()).filter(Boolean),active:active!=='꺼짐'};});await api('/api/station/collection-rules',{mode:$('mode').value,targets});await load(true);}catch(e){$('error').textContent=e.message;}};
function age(){document.querySelectorAll('[data-at]').forEach(e=>{const s=Math.max(0,Math.floor((Date.now()-Date.parse(e.dataset.at))/1000));e.textContent=(s<1?'방금 전':s<60?s+'초 전':Math.floor(s/60)+'분 전')+' · '+new Date(e.dataset.at).toLocaleString('ko-KR');});}
setInterval(age,1000);$('refresh').onclick=()=>load(true);window.addEventListener('collection:changed',()=>load());window.addEventListener('collection:connected',()=>{$('connection').textContent='웹소켓 연결됨 · 변경 시 갱신';load();});window.addEventListener('collection:disconnected',()=>$('connection').textContent='연결 끊김 · 재연결 대기');load();
</script><script>document.getElementById('mode').disabled=true;document.getElementById('targets').readOnly=true;document.getElementById('saveRules').textContent='컨트롤에서 모드 · 대상 변경';document.getElementById('saveRules').onclick=()=>location.href='/control.html?station='+encodeURIComponent(new URLSearchParams(location.search).get('station')||'duugi');</script></html>
