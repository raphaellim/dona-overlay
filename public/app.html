<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1220"><title>라이브캐치 · 방송 관리</title><link rel="stylesheet" href="/console.css?v=616888"></head><body class="login-page"><div id="appMount"></div><template id="loginTemplate"><main class="login-layout">
<section class="login-story"><div class="brand-mark" aria-hidden="true">ON</div><span class="eyebrow">BROADCAST WORKSPACE</span><h1>방송 준비부터 정산까지<br><span>하나의 운영 콘솔.</span></h1><p>후원 입력과 승인, 방송 운영, 오버레이3 송출을<br>방송국별로 한곳에서 관리하세요.</p><div class="login-features"><div><span>₩</span>수동 후원 입력 · 자동 수집 승인</div><div><span>▶</span>방송 참여자 · 타이머 · 룰렛</div><div><span>▣</span>오버레이3 · 은행 기기 · 채팅 연결</div></div></section>
<article class="login-card"><h2>방송국에 로그인</h2><p>사용할 계정 종류를 먼저 선택하세요.</p><div class="roles" role="group" aria-label="계정 종류"><button type="button" id="admin" class="role-card active" aria-pressed="true"><strong>방송국 관리자</strong><span>방송국 전체 운영·설정</span></button><button type="button" id="manager" class="role-card" aria-pressed="false"><strong>방송 매니저</strong><span>발급받은 계정으로 운영</span></button></div>
<p id="roleHelp" class="form-note"></p><form id="form"><label for="station">방송국 코드<input id="station" required autocapitalize="off" autocomplete="organization" placeholder="방송국 코드를 입력하세요" spellcheck="false"></label><label id="userRow" for="username" hidden>매니저 아이디<input id="username" autocapitalize="off" autocomplete="username" placeholder="관리자가 발급한 아이디"></label><label for="password">비밀번호<div class="password-field"><input id="password" type="password" autocomplete="current-password" required placeholder="계정 비밀번호 입력"><button type="button" id="showPassword" aria-label="비밀번호 표시">보기</button></div></label><button class="primary" id="submit">관리자로 로그인 →</button></form><p id="error" role="status" aria-live="polite"></p><p class="login-hint">방송국 코드와 계정 정보는 방송국 관리자에게 확인하세요.</p><p class="login-footer">로그인하면 해당 방송국의 운영 홈으로 이동합니다.</p></article></main>
