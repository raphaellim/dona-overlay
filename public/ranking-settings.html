<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합순위 설정</title><style>@font-face{font-family:ControlUI;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}body{background:#141c29;color:#ecf2fa;font:16px ControlUI,system-ui;padding:16px;margin:0}main{max-width:850px;margin:auto}section{background:#202c3c;border:1px solid #42516a;border-radius:12px;padding:18px;margin:12px 0}label{display:block;margin:12px 0}input,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #62728b;background:#101c2b;color:inherit}input[type=text]{width:min(350px,90%)}button{cursor:pointer;margin:4px}iframe{border:0;width:320px;height:480px;background:repeating-conic-gradient(#647080 0 25%,#8a94a1 0 50%) 0/24px 24px}#status{color:#80e5c1}small{color:#b8c4d8}</style></head><body><main><h1>통합순위</h1><section><label>타이틀 <input id="title" maxlength="30" value="통합순위"></label><label>표시 인원 <input id="limit" type="number" min="1" max="10" value="10"></label><label>글자 크기 <input id="font" type="number" min="14" max="36" value="22"> px</label><label>배경 투명도 <input id="alpha" type="range" min="0" max="100" value="25"><output id="alphaValue"></output></label><p><small>현재 방송 계좌+투네 합계 · 1위 다이아 / 2·3위 별 / 4위부터 하트<br>동점은 같은 순위입니다. 300×460px 기준이며 글자를 키우면 세로도 늘려주세요.</small></p><button id="save">설정 저장</button><button id="copy">순위 오버레이 주소 복사</button><p id="status" role="status"></p></section><section><h2>저장된 설정 미리보기</h2><iframe id="preview" title="통합순위 미리보기"></iframe></section></main><script src="/ranking-settings.js?v=616842"></script></body></html>
