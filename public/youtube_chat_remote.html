<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 채팅 리모컨</title>
  <style>
    :root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#241c2a;background:#f7f4f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:26px;margin:0;letter-spacing:-.04em}h2{font-size:18px;margin:0 0 15px}p{margin:8px 0;color:#746b79}section{background:white;border:1px solid #e9e1eb;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 8px 25px #3923470a}label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}input,textarea,select{font:inherit;width:100%;border:1px solid #d9cedf;background:#fff;border-radius:11px;padding:12px 13px;outline:none}input:focus,textarea:focus,select:focus{border-color:#bd65a4;box-shadow:0 0 0 3px #f8dfef}textarea{min-height:90px;resize:vertical}button,a.button{font:inherit;font-weight:700;cursor:pointer;border-radius:11px;border:1px solid #d7c9da;background:white;color:#48304a;padding:10px 15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}button.primary{background:#aa397f;border-color:#aa397f;color:white}button:disabled{opacity:.55;cursor:not-allowed}.row{display:flex;align-items:center;gap:9px}.row input{flex:1;min-width:0}.note{font-size:13px;line-height:1.5}.status{font-size:14px;color:#70405e;font-weight:700}.accounts{display:grid;gap:10px}.account{display:grid;grid-template-columns:auto minmax(0,1fr) 140px minmax(130px,1fr) auto;align-items:center;gap:10px;border:1px solid #eee5ed;border-radius:13px;padding:12px}.account .name{font-weight:750}.account small{display:block;color:#857b89;font-size:12px;margin-top:3px}.account input[type=checkbox]{width:20px;height:20px;accent-color:#aa397f}.account-actions{display:flex;gap:6px}.account-actions button{padding:8px 10px;font-size:13px}.preview{display:grid;gap:7px;margin-top:15px}.preview div{background:#faf5f9;border-radius:9px;padding:10px 12px;overflow-wrap:anywhere}.preview strong{color:#9d367a}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:17px}.result{margin-top:13px;white-space:pre-wrap;font-size:14px;line-height:1.5}.result.error{color:#ab2844}.result.ok{color:#28764f}.hint{background:#fff7e9;border:1px solid #f0dfbe;border-radius:12px;padding:12px 14px;color:#725223}.footer{font-size:13px;color:#857a87}@media(max-width:700px){.wrap{padding:17px 12px 60px}h1{font-size:22px}section{padding:17px}.row{flex-wrap:wrap}.row button{width:100%}.account{grid-template-columns:auto 1fr auto;gap:8px}.account select,.account .manual{grid-column:2 / -1}.account-actions{grid-column:2 / -1}.account-actions button{flex:1}.actions button{flex:1}.account .name{font-size:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><h1>💬 유튜브 채팅 리모컨</h1><span class="status" id="connection">서버 확인 중</span></header>
  <section>
    <h2>방송 선택</h2>
    <label for="liveUrl">채팅할 라이브 주소</label>
    <div class="row"><input id="liveUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="url"><button id="connect">방송 확인</button></div>
    <p class="note" id="liveStatus">라이브 방송 주소를 입력하세요. 다른 채널 방송 주소도 사용할 수 있습니다.</p>
  </section>
  <section>
    <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">채팅 계정</h2><button id="addAccount">+ 계정 연결</button></div>
    <div id="accounts" class="accounts"><p>연결된 계정이 없습니다.</p></div>
    <p class="note">채팅을 보낼 각 계정에서 Google 승인을 한 번씩 받아야 합니다. 계정별로 랜덤 또는 수동 개별 멘트를 선택하세요. 기존 이모지는 수동 개별 멘트로 유지됩니다.</p>
  </section>
  <section>
    <h2>메시지 작성</h2>
    <label for="message">공용 멘트</label><textarea id="message" maxlength="180" placeholder="예: 빵떠기 화이팅"></textarea>
    <div id="preview" class="preview" aria-live="polite"></div>
    <div class="actions"><button class="primary" id="sendSelected">선택 계정 전송</button><span class="note">전송 형식: 공용멘트업 개별멘트 (업 앞에는 공백 없음)</span></div>
    <div id="result" class="result" role="status" aria-live="polite"></div>
  </section>
  <div class="hint note" id="setupNote">서버 연동 전에는 미리보기만 가능합니다. 계정 인증 및 실제 전송에는 서버 API가 필요합니다.</div>
</main>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const api = '/api/youtube-chat';
  const station = new URLSearchParams(location.search).get('station') || 'default';
  let accounts = [], chatId = '', serverReady = false, busy = false;
  const stored = JSON.parse(localStorage.getItem('chatRemoteDraft') || '{}');
  $('liveUrl').value = stored.url || '';
  $('message').value = stored.message || '';
  const saveDraft = () => localStorage.setItem('chatRemoteDraft', JSON.stringify({url:$('liveUrl').value,message:$('message').value}));
  const composed = a => `${$('message').value.trim()} ${a.suffixMode === 'random' ? '[랜덤: 6개 중 하나]' : (a.manualSuffix || '[수동 멘트 입력 필요]')}`;
  const errorText = e => e?.message || '요청을 처리하지 못했습니다.';
  async function request(path, options={}) {
    const response = await fetch(api + path + (path.includes('?') ? '&' : '?') + 'station=' + encodeURIComponent(station), {credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});
    const payload = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(payload.error || payload.message || `서버 오류 (${response.status})`);
    return payload;
  }
  function render(){
    const list = $('accounts'); list.replaceChildren();
    if(!accounts.length){const p=document.createElement('p');p.textContent='연결된 계정이 없습니다.';list.append(p)}
    accounts.forEach(a=>{
      const row=document.createElement('div');row.className='account';
      const check=document.createElement('input');check.type='checkbox';check.checked=a.selected!==false;check.setAttribute('aria-label',`${a.name} 선택`);check.onchange=()=>{a.selected=check.checked;renderPreview()};
      const name=document.createElement('div');name.className='name';name.textContent=a.name;
      const sub=document.createElement('small');sub.textContent=a.connected===false?'재인증 필요':'연결됨';name.append(sub);
      const mode=document.createElement('select');mode.setAttribute('aria-label',`${a.name} 개별 멘트 방식`);
      [['random','🎲 랜덤'],['manual','✍️ 수동 입력']].forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;mode.append(option)});
      mode.value=a.suffixMode || 'random';
      const manual=document.createElement('input');manual.className='manual';manual.placeholder='개별 멘트 + 이모지';manual.maxLength=80;manual.value=a.manualSuffix || '';manual.setAttribute('aria-label',`${a.name} 수동 개별 멘트`);manual.hidden=mode.value!=='manual';
      function saveAccount(changes){a.pending=(a.pending||Promise.resolve()).then(async()=>{await request(`/accounts/${encodeURIComponent(a.id)}`,{method:'PATCH',body:JSON.stringify(changes)});Object.assign(a,changes);a.saveError=null;renderPreview()}).catch(e=>{mode.value=a.suffixMode;manual.value=a.manualSuffix || '';manual.hidden=mode.value!=='manual';$('result').textContent=errorText(e);$('result').className='result error';a.saveError=e;});return a.pending}
      mode.onchange=()=>{manual.hidden=mode.value!=='manual';saveAccount({suffixMode:mode.value})};
      manual.onchange=()=>saveAccount({manualSuffix:manual.value.trim()});
      const actions=document.createElement('div');actions.className='account-actions';
      const send=document.createElement('button');send.textContent='개별 전송';send.onclick=()=>sendMessages([a]);send.disabled=!serverReady||a.connected===false;
      actions.append(send);row.append(check,name,mode,manual,actions);list.append(row)
    });renderPreview()
  }
  function renderPreview(){
    const box=$('preview');box.replaceChildren();
    const selected=accounts.filter(a=>a.selected!==false);
    if(!$('message').value.trim()||!selected.length)return;
    selected.forEach(a=>{const item=document.createElement('div');const label=document.createElement('strong');label.textContent=a.name+' → ';item.append(label,document.createTextNode(composed(a)));box.append(item)})
  }
  async function loadAccounts(){try{const data=await request('/accounts');accounts=(data.accounts||[]).map(a=>({...a,selected:true}));serverReady=true;$('connection').textContent='서버 연결됨';$('setupNote').hidden=true}catch(e){serverReady=false;$('connection').textContent='서버 연동 필요';$('setupNote').hidden=false}render()}
  $('addAccount').onclick=()=>{if(!serverReady){$('result').textContent='계정을 연결하려면 서버의 Google 인증 기능을 먼저 설정하세요.';$('result').className='result error';return}location.href=api+'/auth?station='+encodeURIComponent(station)};
  $('connect').onclick=async()=>{saveDraft();chatId='';$('liveStatus').textContent='방송 확인 중…';try{const data=await request('/resolve',{method:'POST',body:JSON.stringify({url:$('liveUrl').value.trim()})});chatId=data.liveChatId;$('liveStatus').textContent=`채팅 가능 · ${data.title||'라이브 방송'}`}catch(e){$('liveStatus').textContent=errorText(e)}};
  async function sendMessages(chosen){if(busy)return;const message=$('message').value.trim();if(!message||!chosen.length||!chatId){$('result').textContent='방송을 확인하고 공용 멘트와 계정을 선택하세요.';$('result').className='result error';return}busy=true;$('sendSelected').disabled=true;$('result').textContent='전송 중…';$('result').className='result';try{await Promise.all(chosen.map(a=>a.pending).filter(Boolean));if(chosen.some(a=>a.saveError))throw new Error('개별 멘트 저장에 실패했습니다. 다시 입력하세요.');const data=await request('/send',{method:'POST',body:JSON.stringify({url:$('liveUrl').value.trim(),accountIds:chosen.map(a=>a.id),message})});const outcomes=data.results||[];$('result').textContent=outcomes.length?outcomes.map(x=>`${x.name||x.accountId}: ${x.ok?'전송 완료 · '+x.text:x.error||'실패'}`).join('\n'):'전송 요청이 완료되었습니다.';$('result').className=outcomes.some(x=>!x.ok)?'result error':'result ok'}catch(e){$('result').textContent=errorText(e);$('result').className='result error'}finally{busy=false;$('sendSelected').disabled=false}}
  $('sendSelected').onclick=()=>sendMessages(accounts.filter(a=>a.selected!==false&&a.connected!==false));
  $('liveUrl').addEventListener('input',()=>{chatId='';$('liveStatus').textContent='방송 확인을 눌러주세요.';saveDraft()});$('message').addEventListener('input',()=>{saveDraft();renderPreview()});
  const params=new URLSearchParams(location.search);if(params.has('auth')){$('result').textContent=params.get('auth')==='ok'?'계정 연결이 완료되었습니다.':'계정 연결에 실패했습니다.';history.replaceState(null,'',location.pathname+'?station='+encodeURIComponent(station))}
  loadAccounts();
</script>
</body>
</html>
